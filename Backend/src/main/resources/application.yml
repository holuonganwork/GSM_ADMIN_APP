server:
  port: 8000
  servlet:
    context-path: /api

spring:
  application:
    name: gsm-compliance-portal-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/gsm_simulator
    driver-class-name: org.postgresql.Driver
    username: gsm_admin
    password: gsm_password_2026
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
